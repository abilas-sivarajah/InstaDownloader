# Ein Tag wie v1.2.3 baut die signierte APK und hängt sie an ein GitHub-Release.
# Einmalige Vorbereitung: tools/setup-signing.ps1
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # nur für "gh release create"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Voraussetzungen prüfen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Der Tag $GITHUB_REF_NAME zeigt auf einen Commit, der nicht auf main liegt."
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Die Secrets KEYSTORE_BASE64 und KEYSTORE_PASSWORD fehlen. Bitte tools/setup-signing.ps1 ausführen."
            exit 1
          fi

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Bewusst ohne Cache: ein Release wird immer frisch gebaut.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Testen
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Signierte APK bauen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CLIPFANG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export CLIPFANG_KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$CLIPFANG_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$CLIPFANG_KEYSTORE"
          ./gradlew --no-daemon :app:assembleRelease "-PreleaseVersion=${GITHUB_REF_NAME#v}"

      - name: APK prüfen
        run: |
          mkdir -p dist
          apk="dist/Clipfang-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs"
          if grep -q 'CN=Android Debug' <<< "$certs"; then
            echo "::error::Die APK ist mit dem Debug-Schlüssel signiert."
            exit 1
          fi
          cd dist && sha256sum ./*.apk | sed 's|\./||' > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt --verify-tag --generate-notes --title "Clipfang ${GITHUB_REF_NAME#v}"
